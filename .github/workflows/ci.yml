name: CI/CD

# Runs on every push and pull request to main/develop.
# Stages: lint -> unit tests -> integration tests + coverage -> 60-story verification -> deploy (main only)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: 1. Lint (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Syntax-check every JavaScript file
        run: npm run lint

  unit:
    name: 2. Unit tests (Control layer)
    needs: lint
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: 3. Integration tests + coverage
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: designmatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/designmatch_test
      SESSION_SECRET: ci-only-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run all tests with coverage (fails below jest.config.js thresholds)
        run: npm run test:coverage
      - name: Add coverage summary to the run page
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;const r=k=>t[k].pct+'%';console.log('### Test coverage\n\n| Statements | Branches | Functions | Lines |\n|---|---|---|---|\n| '+[r('statements'),r('branches'),r('functions'),r('lines')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  stories:
    name: 4. Verify all 60 user stories
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: designmatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/designmatch
      SESSION_SECRET: ci-only-session-secret
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Create schema and load Faker demo data
        run: npm run db:reset
      - name: Start the app
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Run the story verification
        run: npm run verify:stories | tee story-results.txt
      - name: Add story results to the run page
        if: always()
        run: |
          echo '### User story verification' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat story-results.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload story results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-verification
          path: |
            story-results.txt
            server.log

  deploy:
    name: 5. Deploy to Render
    needs: stories
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Check deployment settings
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL secret and the APP_URL variable (see docs/deployment.md)."
            exit 1
          fi
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for the new version and smoke-test it
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            BODY=$(curl -fsS "$APP_URL/api/health" || true)
            if echo "$BODY" | grep -q "\"version\":\"${EXPECTED_SHA:0:7}\""; then
              curl -fsS "$APP_URL/api/idps?pageSize=1&log=false" > /dev/null
              echo "Deployed version ${EXPECTED_SHA:0:7} is live and healthy"; exit 0
            fi
            sleep 15
          done
          echo "::error::The new version did not become live in time. Last health response: $BODY"; exit 1
